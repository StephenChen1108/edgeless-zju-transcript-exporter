<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>无际 Edgeless</title>
  <link rel="stylesheet" href="popup.css">
  <script src="vendor/jszip.min.js" defer></script>
  <script src="popup.js" defer></script>
</head>
<body>
  <main id="main-view">
    <header class="header">
      <img class="mascot" src="UI&amp;icon/assets/mascot.png" alt="无际蓝色袋鼠">
      <div class="brand">
        <h1>无际 <span class="english">Edgeless</span></h1>
        <p>惟学无际，际于天地</p>
      </div>
      <div class="header-actions">
        <span id="app-version" class="app-version"></span>
        <button class="icon-button" id="settings" type="button" aria-label="设置" title="设置"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 2h4l.5 2.2 1.8.8 2-.9 2.8 2.8-.9 2 .8 1.8L23 11v4l-2.2.5-.8 1.8.9 2-2.8 2.8-2-.9-1.8.8L14 24h-4l-.5-2.2-1.8-.8-2 .9-2.8-2.8.9-2-.8-1.8L1 15v-4l2.2-.5.8-1.8-.9-2L5.9 4l2 .9 1.8-.8L10 2Z" transform="translate(0 -1) scale(1 .96)"/><circle cx="12" cy="12" r="3"/></svg></button>
        <button class="icon-button" id="help" type="button" aria-label="使用帮助" title="使用帮助"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M9.5 9a2.5 2.5 0 1 1 4.1 1.9c-1.1.9-1.6 1.3-1.6 2.6M12 17h.01"/></svg></button>
      </div>
    </header>

    <div class="mode-switch" role="group" aria-label="浏览范围">
      <button id="current-mode" class="mode-button active" type="button" aria-pressed="true">当前课次</button>
      <button id="course-mode" class="mode-button" type="button" aria-pressed="false">整门课程</button>
    </div>

    <section class="properties" aria-label="课程信息">
      <div class="property"><span class="property-label"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5c-3-2-6-2-9-1v15c3-1 6-1 9 1 3-2 6-2 9-1V4c-3-1-6-1-9 1ZM12 5v15"/></svg>课程</span><span class="property-value" id="course">—</span></div>
      <div class="property"><span class="property-label"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="7" r="4"/><path d="M4 21c0-4 3-7 8-7s8 3 8 7"/></svg>教师</span><span class="property-value" id="teacher">—</span></div>
      <div class="property" id="time-property"><span class="property-label"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4M17 3v4M3 10h18"/></svg><span id="third-property-label">时间</span></span><span class="property-value" id="time">—</span></div>
    </section>

    <div id="current-content" class="mode-content">
    <section id="loading-panel" class="message-panel" role="status" aria-live="polite">
      <span class="spinner" aria-hidden="true"></span>
      <p>正在检测课堂内容…</p>
    </section>

    <section id="message-panel" class="message-panel" hidden>
      <svg class="message-icon" viewBox="0 0 64 64" aria-hidden="true"><path d="M13 7h27l11 11v39H13zM40 7v12h11M21 30h22M21 38h16"/><circle cx="44" cy="46" r="9"/><path d="m50 52 7 7"/></svg>
      <h2 id="message-title"></h2>
      <p id="message-detail"></p>
    </section>

    <section id="resources" hidden aria-label="当前课次可用内容">
      <div id="resource-status" class="resource-status" role="status" aria-live="polite"><span id="resource-status-text">正在检测课堂内容…</span><button id="retry-detection" class="retry-detection" type="button" hidden>重新检测</button></div>
      <div class="resource-cards">
        <button id="transcript-card" class="resource-card" type="button" aria-pressed="false" aria-controls="success-panel" disabled><span class="resource-icon" aria-hidden="true"><img class="resource-glyph" src="icons/resource-transcript.svg" alt=""></span><span><strong>逐字稿</strong><small id="transcript-card-status">检测中…</small></span></button>
        <button id="ppt-card" class="resource-card" type="button" aria-pressed="false" aria-controls="ppt-preview" disabled><span class="resource-icon" aria-hidden="true"><img class="resource-glyph" src="icons/resource-ppt.svg" alt=""></span><span><strong>PPT 课件</strong><small id="ppt-card-status">检测中…</small></span></button>
      </div>
      <section id="preview-placeholder" class="resource-preview preview-placeholder"><h2>内容预览</h2><p id="preview-placeholder-text">正在检测课堂内容…</p></section>
      <section id="success-panel" class="resource-preview" hidden>
        <h2>内容预览 <small id="transcript-count"></small></h2>
        <div id="preview" class="preview" aria-label="原始字幕预览" tabindex="0"></div>
      </section>
      <section id="ppt-preview" class="resource-preview" hidden>
        <h2>内容预览 <small id="ppt-page-count"></small></h2>
        <div id="ppt-thumbnails" class="ppt-thumbnails" aria-label="课件前四页缩略图"></div>
        <p id="ppt-preview-empty" class="ppt-preview-empty">正在读取预览…</p>
      </section>
      <div class="resource-actions">
        <button id="primary-action" class="primary-action" type="button" disabled>导出逐字稿</button>
        <button id="ppt-action" class="ppt-action" type="button" disabled>下载 PPT</button>
      </div>
    </section>
    </div>

    <section id="course-content" class="mode-content course-content" hidden>
      <div class="course-list-header"><h3>课次资源</h3><label class="course-select-all"><input id="course-select-all" type="checkbox" disabled><span>全选</span><small id="course-selection-count"></small></label></div>
      <p id="course-count" class="course-count" aria-live="polite">正在读取课次…</p>
      <div id="course-list" class="course-list" aria-label="全部课次"></div>
      <fieldset class="export-format">
        <legend>导出格式</legend>
        <label><input type="radio" name="course-format" value="merged_markdown" checked> 单个 Markdown</label>
        <label><input type="radio" name="course-format" value="zip"> 课程资料包 ZIP</label>
      </fieldset>
      <p id="course-status" class="course-status" role="status" aria-live="polite"></p>
      <button id="course-action" class="primary-action" type="button">导出课程资料包</button>
    </section>
    <footer>Prod by 车厘子</footer>
  </main>

  <main id="settings-view" class="settings-view" hidden>
    <header class="settings-header"><button id="settings-back" class="back-button" type="button" aria-label="返回主界面">←</button><div><h1>设置</h1><p id="save-status" class="save-status" role="status" aria-live="polite">修改后自动保存</p></div></header>
    <div class="settings-scroll">
      <section class="settings-section"><h2>打开时</h2><div class="settings-group">
        <div class="setting-row"><span>打开时显示</span><button id="setting-default-mode" class="setting-select" type="button" aria-label="打开时显示" aria-haspopup="listbox" aria-expanded="false"><span class="setting-select-value"></span></button></div>
      </div></section>
      <section class="settings-section"><h2>逐字稿</h2><div class="settings-group">
        <div class="setting-row"><span>逐字稿语言</span><button id="setting-language" class="setting-select" type="button" aria-label="逐字稿语言" aria-haspopup="listbox" aria-expanded="false"><span class="setting-select-value"></span></button></div>
        <label class="setting-row"><span>保留时间戳</span><input id="setting-timestamp" class="switch" type="checkbox"></label>
        <label class="setting-row"><span>附上课程信息</span><input id="setting-frontmatter" class="switch" type="checkbox"></label>
        <div class="setting-row filename-row"><span>文件名格式</span><button id="setting-filename" class="setting-select" type="button" aria-label="文件名格式" aria-haspopup="listbox" aria-expanded="false"><span class="setting-select-value"></span></button></div>
        <p id="filename-preview" class="filename-preview"></p>
      </div></section>
      <section class="settings-section"><h2>整门课程</h2><div class="settings-group">
        <div class="setting-row"><span>默认导出格式</span><button id="setting-course-format" class="setting-select" type="button" aria-label="整门课程默认导出格式" aria-haspopup="listbox" aria-expanded="false"><span class="setting-select-value"></span></button></div>
      </div><details id="zip-details" class="zip-details"><summary><span>ZIP 资料包包含</span><small id="zip-summary"></small></summary><div class="settings-group">
        <label class="setting-row"><span>整门逐字稿（1 个文件）</span><input data-zip-key="mergedMarkdown" type="checkbox"></label>
        <label class="setting-row"><span>每节逐字稿（分文件）</span><input data-zip-key="splitMarkdown" type="checkbox"></label>
        <label class="setting-row"><span>课次目录（index.md）</span><input data-zip-key="index" type="checkbox"></label>
        <label class="setting-row"><span>PPT 课件 <small class="badge">实验性</small></span><input data-zip-key="ppt" type="checkbox"></label>
      </div><p class="setting-note">仅影响整门课程 ZIP；单课 PPT 预览和下载不受影响。</p><p id="zip-hint" class="inline-hint" aria-live="polite"></p></details></section>
      <section class="settings-section"><h2>外观</h2><div class="settings-group"><div class="setting-row"><span>主题</span><button id="setting-theme" class="setting-select" type="button" aria-label="主题" aria-haspopup="listbox" aria-expanded="false"><span class="setting-select-value"></span></button></div></div></section>
      <section class="settings-section"><h2>其他</h2><button id="reset-settings" class="reset-button" type="button">恢复默认设置</button></section>
      <button id="reload-extension" class="reload-extension" type="button" hidden>重新加载扩展以启用设置</button>
    </div>
    <footer>Prod by 车厘子</footer>
  </main>

  <div id="setting-menu" class="setting-menu" role="listbox" hidden></div>

  <dialog id="info-dialog">
    <form method="dialog">
      <h2 id="dialog-title"></h2>
      <p id="dialog-detail"></p>
      <button type="submit">知道了</button>
    </form>
  </dialog>
  <dialog id="reset-dialog"><form method="dialog"><h2>恢复默认设置？</h2><p>这将重置所有 Edgeless 导出偏好。</p><div class="dialog-actions"><button value="cancel">取消</button><button id="confirm-reset" value="default">恢复默认</button></div></form></dialog>
</body>
</html>
